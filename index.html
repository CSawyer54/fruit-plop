<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fruit Plop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone game — HUD row, glass fruit jar on a mint orchard, fruit ribbon + big Shake button */
:root {
  --mint-hi: #e6f8ec;
  --mint: #c6ebd5;
  --mint-lo: #a5d9bb;
  --teal: #2e6d64;
  --teal-deep: #1d4a43;
  --cream: #fffdf3;
  --sun: #ffbf2f;
  --sun-hot: #ff8a1f;
  --sun-deep: #d9670c;
  --berry: #ff4f6d;
  --ink: #23433d;
  --font-display: "Fredoka", "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
html { background: var(--mint); }
[hidden] { display: none !important; }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-display);
  background:
    radial-gradient(circle at 50% 18%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(rgba(255,255,255,.45) 1.6px, transparent 2.2px) 0 0 / 22px 22px,
    linear-gradient(var(--mint-hi), var(--mint) 50%, var(--mint-lo));
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

.app {
  box-sizing: border-box;
  height: 100%;
  max-width: 540px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- HUD ---------- */
.hud {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
}
.hud-left { display: flex; gap: 8px; }
.icon-btn {
  width: 44px; height: 44px;
  border: 0; border-radius: 14px;
  background: var(--teal);
  color: var(--cream);
  display: grid; place-items: center;
  box-shadow: 0 4px 0 var(--teal-deep);
  transition: transform .08s, box-shadow .08s;
}
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--teal-deep); }
.icon-btn svg { width: 24px; height: 24px; }
.score-pill {
  min-width: 118px;
  padding: 3px 18px 6px;
  border-radius: 18px;
  background: var(--teal);
  color: var(--cream);
  text-align: center;
  box-shadow: 0 4px 0 var(--teal-deep);
  line-height: 1;
}
.score {
  display: block;
  font-size: 32px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
}
.score.bump { animation: bump .25s ease-out; }
.best {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em;
  color: #cfe9e2;
  font-variant-numeric: tabular-nums;
}
.best svg { width: 12px; height: 12px; color: var(--sun); }
.hud-right { justify-self: end; }
.next {
  position: relative;
  width: 58px; height: 58px;
  border-radius: 50%;
  background: var(--cream);
  border: 4px solid var(--teal);
  box-sizing: border-box;
  display: grid; place-items: center;
  box-shadow: 0 4px 0 var(--teal-deep);
}
.next img { width: 78%; height: 78%; object-fit: contain; }
.next img.pop { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
.next-label {
  position: absolute; left: 50%; bottom: -9px;
  transform: translateX(-50%);
  padding: 1px 8px 2px;
  border-radius: 99px;
  background: var(--teal);
  color: var(--cream);
  font-size: 10px; font-weight: 600;
  letter-spacing: .14em;
}

/* ---------- Stage ---------- */
.stage { position: relative; flex: 1; min-height: 0; }
#game {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
}

/* ---------- Bottom controls ---------- */
.controls { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.evo-wrap {
  width: 100%;
  box-sizing: border-box;
  padding: 4px;
  background: var(--teal);
  border-radius: 999px 0 0 999px;
  clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%);
}
.evo {
  height: 38px;
  box-sizing: border-box;
  padding: 0 28px 0 12px;
  background: linear-gradient(#f4fbf5, #dcefe3);
  border-radius: 999px 0 0 999px;
  clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%);
  display: flex; align-items: center; justify-content: space-between; gap: 2px;
}
.evo img {
  flex: 0 1 calc(var(--s) * 1px);
  min-width: 0;
  max-width: calc(var(--s) * 1px);
  aspect-ratio: 1;
  object-fit: contain;
  opacity: .32;
  filter: grayscale(.7);
  transition: opacity .3s, filter .3s, transform .3s;
}
.evo img.seen { opacity: 1; filter: none; }
.evo img.top { animation: hop 1.2s ease-in-out infinite; }

.shake {
  position: relative;
  overflow: hidden;
  width: min(100%, 280px);
  height: 58px;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(var(--sun), var(--sun-hot));
  color: #fff;
  font-size: 24px; font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  text-shadow: 0 2px 0 rgba(160,70,0,.45);
  box-shadow: 0 6px 0 var(--sun-deep), 0 12px 22px rgba(217,103,12,.28);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .08s, box-shadow .08s, filter .2s;
}
.shake::before {
  content: "";
  position: absolute; inset: 0;
  background: rgba(255,255,255,.38);
  transform-origin: left center;
  transform: scaleX(var(--charge, 1));
}
.shake.charging { background: linear-gradient(#f6e3c4, #efcf9f); box-shadow: 0 6px 0 #d4a668, 0 12px 22px rgba(217,103,12,.12); }
.shake.charging::before { background: linear-gradient(var(--sun), var(--sun-hot)); }
.shake.ready::before { opacity: 0; }
.shake.ready { animation: ready 2.4s ease-in-out infinite; }
.shake:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sun-deep), 0 6px 12px rgba(217,103,12,.25); }
.shake > * { position: relative; }
.shake svg { width: 32px; height: 32px; }
.shake.go svg { animation: wiggle .4s ease-in-out; }

/* ---------- Overlays ---------- */
.overlay {
  position: fixed; inset: 0;
  z-index: 20;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(29,74,67,.38);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
  animation: fade .3s ease-out;
}
.card {
  width: min(320px, 100%);
  box-sizing: border-box;
  padding: 24px 22px 22px;
  border-radius: 28px;
  background: var(--cream);
  border: 4px solid var(--teal);
  box-shadow: 0 8px 0 var(--teal-deep), 0 24px 50px rgba(29,74,67,.35);
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  animation: pop .45s cubic-bezier(.3,1.5,.5,1);
}
.card h2 { margin: 0; font-size: 30px; font-weight: 700; color: var(--berry); text-wrap: balance; }
.card h2.calm { color: var(--teal); font-size: 26px; }
.card p { margin: 0; font-size: 16px; color: #4b6a63; text-wrap: balance; }
.final { font-size: 54px; font-weight: 700; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.newbest {
  padding: 3px 12px;
  border-radius: 99px;
  background: var(--sun);
  color: #6b3a00;
  font-size: 13px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
}
.biggest {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px 8px 10px;
  border-radius: 18px;
  background: #e5f4ea;
  text-align: left;
  font-size: 13px; color: #4b6a63;
}
.biggest img { width: 46px; height: 46px; }
.biggest b { display: block; font-size: 18px; color: var(--ink); font-weight: 600; }
.btn-row { display: flex; gap: 10px; width: 100%; margin-top: 4px; }
.btn {
  flex: 1;
  height: 52px;
  border: 0; border-radius: 16px;
  font-size: 18px; font-weight: 600;
  transition: transform .08s, box-shadow .08s;
}
.btn.primary { background: linear-gradient(var(--sun), var(--sun-hot)); color: #fff; box-shadow: 0 5px 0 var(--sun-deep); text-shadow: 0 2px 0 rgba(160,70,0,.35); }
.btn.quiet { background: #e5f4ea; color: var(--teal); box-shadow: 0 5px 0 #b9dcc8; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--teal-deep); }
.hub-link { margin-top: 4px; padding: 6px 10px; font-size: 15px; font-weight: 600; color: var(--teal); text-decoration: none; }
.hub-link:hover, .hub-link:focus-visible { text-decoration: underline; }

@keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
@keyframes bump { 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px) scale(1.12); } }
@keyframes ready { 0%, 86%, 100% { transform: rotate(0); } 89% { transform: rotate(-2deg); } 92% { transform: rotate(2deg); } 95% { transform: rotate(-1deg); } }
@keyframes wiggle { 25% { transform: rotate(-18deg); } 50% { transform: rotate(14deg) translateY(-4px); } 75% { transform: rotate(-8deg); } }
@keyframes fade { from { opacity: 0; } }

@media (max-height: 640px) {
  .shake { height: 50px; font-size: 21px; }
  .icon-btn { width: 40px; height: 40px; }
  .next { width: 52px; height: 52px; }
}
@media (prefers-reduced-motion: reduce) {
  .shake.ready, .evo img.top { animation: none; }
}
</style>

<div class="app">
  <header class="hud">
    <div class="hud-left">
      <button class="icon-btn" id="restartBtn" aria-label="New game" title="New game">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
      </button>
      <button class="icon-btn" id="soundBtn" aria-label="Sound on" title="Sound">

<div class="overlay" id="overPanel" hidden>
  <div class="card" role="dialog" aria-labelledby="overTitle">

<script>
// Link back to the game center, only on the GitHub Pages copy
if (/(^|\.)github\.io$/.test(location.hostname)) for (const a of document.querySelectorAll('.hub-link')) a.hidden = false;
(() => {
'use strict';

/* ================= World constants ================= */
const TAU = Math.PI * 2;
const W = 400;            // jar inner width (world units)
const FLOOR = 650;        // jar floor
const DANGER_Y = 112;     // jar rim — fruit resting above this is in danger
const DROP_Y = 54;        // where the held fruit hangs
const VIEW = { x0: -20, y0: 4, w: W + 40, h: FLOOR + 14 };
const G = 2100;
const DT = 1 / 120;
const ITER = 6;
const REST = 0.12;
const FRICTION = 0.28;
const DROPPABLE = 5;      // grape..orange
const SHAKE_COOLDOWN = 2.5 / 3;   // ~0.83 s
const DANGER_LIMIT = 3;
const GRACE = 1.0;        // seconds a fresh fruit is ignored by the danger check
const GOLD_BONUS = 150;
const PAD = 1.32;         // sprite padding beyond the collision circle
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const FRUITS = [
  { name: 'Grape',        r: 14,  pts: 1,  juice: '#a467e0' },
  { name: 'Blueberry',    r: 19,  pts: 3,  juice: '#4f86ee' },
  { name: 'Lime',         r: 25,  pts: 6,  juice: '#97d84f' },
  { name: 'Banana',       r: 32,  pts: 10, juice: '#ffd83a' },
  { name: 'Orange',       r: 39,  pts: 15, juice: '#ff9d2b' },
  { name: 'Apple',        r: 47,  pts: 21, juice: '#f2393a' },
  { name: 'Peach',        r: 56,  pts: 28, juice: '#ffa08e' },
  { name: 'Coconut',      r: 65,  pts: 36, juice: '#f3e6cf' },
  { name: 'Melon',        r: 76,  pts: 45, juice: '#c6e27a' },
  { name: 'Pineapple',    r: 88,  pts: 55, juice: '#ffc22e' },
  { name: 'Watermelon',   r: 101, pts: 66, juice: '#ff5f72' },
  { name: 'Golden Melon', r: 116, pts: 78, juice: '#ffd84a' },
];
const LAST = FRUITS.length - 1;

/* ================= Fruit art ================= */
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function circlePath(g, R) { g.beginPath(); g.arc(0, 0, R, 0, TAU); }
function ball(g, R, light, base, dark) {
  const gr = g.createRadialGradient(-R * .38, -R * .42, R * .04, -R * .08, -R * .08, R * 1.12);
  gr.addColorStop(0, light); gr.addColorStop(.48, base); gr.addColorStop(1, dark);
  circlePath(g, R * .97); g.fillStyle = gr; g.fill();
}
function rim(g, R, color) { g.lineWidth = Math.max(1.2, R * .06); g.strokeStyle = color; g.stroke(); }
function shine(g, R, x = -.42, y = -.48, s = 1) {
  g.save();
  g.fillStyle = 'rgba(255,255,255,.72)';
  g.beginPath(); g.ellipse(R * x, R * y, R * .19 * s, R * .09 * s, -0.72, 0, TAU); g.fill();
  g.beginPath(); g.arc(R * (x - .14), R * (y + .2), R * .045 * s, 0, TAU); g.fill();
  g.restore();
}
function leaf(g, x, y, len, ang, fill, line) {
  g.save(); g.translate(x, y); g.rotate(ang);
  g.beginPath(); g.moveTo(0, 0);
  g.quadraticCurveTo(len * .5, -len * .45, len, 0);
  g.quadraticCurveTo(len * .5, len * .45, 0, 0);
  g.fillStyle = fill; g.fill();
  g.lineWidth = Math.max(1, len * .08); g.strokeStyle = line; g.lineJoin = 'round'; g.stroke();
  g.beginPath(); g.moveTo(len * .12, 0); g.lineTo(len * .75, 0);
  g.lineWidth = Math.max(.8, len * .05); g.stroke();
  g.restore();
}
function stem(g, x1, y1, x2, y2, w, color, bend = .3) {
  g.save(); g.lineCap = 'round'; g.strokeStyle = color; g.lineWidth = w;
  g.beginPath(); g.moveTo(x1, y1);
  g.quadraticCurveTo(x1 + (x2 - x1) * .1 + (y2 - y1) * -bend, (y1 + y2) / 2, x2, y2);
  g.stroke(); g.restore();
}
function star(g, x, y, ro, ri, n, rot = -Math.PI / 2) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? ri : ro, a = rot + i * Math.PI / n;
    g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  g.closePath();
}
function speckles(g, R, n, color, size, seed, spread = .88) {
  const rand = rng(seed); g.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const a = rand() * TAU, d = Math.sqrt(rand()) * R * spread;
    g.beginPath(); g.arc(Math.cos(a) * d, Math.sin(a) * d, R * size * (.6 + rand() * .6), 0, TAU); g.fill();
  }
}
function face(g, R, o = {}) {
  const s = R * (o.size || .3);
  const cx = (o.x || 0) * R, cy = (o.y ?? .1) * R;
  const ink = o.ink || '#3b2420';
  const ex = s * .8, ey = cy - s * .12, my = cy + s * .38;
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (o.blush !== false) {
    g.fillStyle = o.blush || 'rgba(255,100,128,.42)';
    for (const sx of [-1, 1]) { g.beginPath(); g.ellipse(cx + sx * ex * 1.42, cy + s * .24, s * .27, s * .16, 0, 0, TAU); g.fill(); }
  }
  g.fillStyle = ink; g.strokeStyle = ink; g.lineWidth = s * .14;
  const eyes = o.eyes || 'dot';
  for (const sx of [-1, 1]) {
    const x = cx + sx * ex, y = ey;
    const kind = eyes === 'wink' ? (sx < 0 ? 'dot' : 'happy') : eyes;
    if (kind === 'dot' || kind === 'sparkle') {
      const k = kind === 'sparkle' ? 1.3 : 1;
      g.beginPath(); g.ellipse(x, y, s * .15 * k, s * .19 * k, 0, 0, TAU); g.fill();
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(x - s * .05 * k, y - s * .07 * k, s * .062 * k, 0, TAU); g.fill();
      if (kind === 'sparkle') { g.beginPath(); g.arc(x + s * .06 * k, y + s * .07 * k, s * .032 * k, 0, TAU); g.fill(); }
      g.fillStyle = ink;
    } else if (kind === 'happy') {
      g.beginPath(); g.arc(x, y + s * .09, s * .17, Math.PI * 1.12, Math.PI * 1.88); g.stroke();
    } else if (kind === 'closed') {
      g.beginPath();
      g.moveTo(x + sx * s * .15, y - s * .15); g.lineTo(x - sx * s * .12, y); g.lineTo(x + sx * s * .15, y + s * .15);
      g.stroke();
    } else if (kind === 'sleepy') {
      g.beginPath(); g.arc(x, y - s * .06, s * .16, Math.PI * .15, Math.PI * .85); g.stroke();
    }
  }
  const m = o.mouth || 'smile';
  if (m === 'smile') {
    g.beginPath(); g.arc(cx, my - s * .17, s * .18, Math.PI * .2, Math.PI * .8); g.stroke();
  } else if (m === 'cat' || m === 'tongue') {
    if (m === 'tongue') {
      g.fillStyle = '#ff6f8e';
      g.beginPath(); g.ellipse(cx, my + s * .07, s * .11, s * .14, 0, 0, TAU); g.fill();
      g.fillStyle = ink;
    }
    g.beginPath(); g.arc(cx - s * .1, my - s * .04, s * .1, Math.PI * .05, Math.PI * .95); g.stroke();
    g.beginPath(); g.arc(cx + s * .1, my - s * .04, s * .1, Math.PI * .05, Math.PI * .95); g.stroke();
  } else if (m === 'o') {
    g.beginPath(); g.ellipse(cx, my, s * .09, s * .11, 0, 0, TAU); g.fill();
  } else if (m === 'grin' || m === 'laugh') {
    const w = m === 'laugh' ? .25 : .2;
    g.beginPath();
    g.moveTo(cx - s * w, my - s * .1);
    g.quadraticCurveTo(cx, my - s * .14, cx + s * w, my - s * .1);
    g.quadraticCurveTo(cx + s * w * .95, my + s * .3, cx, my + s * .3);
    g.quadraticCurveTo(cx - s * w * .95, my + s * .3, cx - s * w, my - s * .1);
    g.closePath(); g.fill();
    g.save(); g.clip();
    g.fillStyle = '#ff7b93';
    g.beginPath(); g.ellipse(cx, my + s * .3, s * .15, s * .12, 0, 0, TAU); g.fill();
    g.restore();
  }
  g.restore();
}

function bananaShape(g, len, th) {
  g.beginPath();
  g.moveTo(-len / 2, -th * .2);
  g.bezierCurveTo(-len * .3, len * .42, len * .3, len * .42, len / 2, -th * .2);
  g.bezierCurveTo(len * .28, len * .42 - th * 1.9, -len * .28, len * .42 - th * 1.9, -len / 2, -th * .2);
  g.closePath();
}
function oneBanana(g, R, x, y, rot, s, shade) {
  const len = R * 1.62 * s, th = R * .27 * s;
  g.save(); g.translate(x, y); g.rotate(rot);
  const gr = g.createLinearGradient(0, -th, 0, len * .34);
  gr.addColorStop(0, shade ? '#ffe680' : '#fff4a8');
  gr.addColorStop(.45, shade ? '#f4c21f' : '#ffd93a');
  gr.addColorStop(1, shade ? '#d99410' : '#f2ac1c');
  bananaShape(g, len, th); g.fillStyle = gr; g.fill();
  g.lineJoin = 'round'; rim(g, R * .9, '#a86a0d');
  // ridge
  g.beginPath(); g.moveTo(-len * .36, len * .05);
  g.bezierCurveTo(-len * .2, len * .27, len * .2, len * .27, len * .36, len * .05);
  g.strokeStyle = 'rgba(200,120,10,.35)'; g.lineWidth = R * .035; g.stroke();
  // tips
  g.fillStyle = '#5e3d18';
  g.beginPath(); g.arc(-len / 2 + th * .12, -th * .15, th * .2, 0, TAU); g.fill();
  g.beginPath(); g.arc(len / 2 - th * .12, -th * .15, th * .2, 0, TAU); g.fill();
  g.restore();
}
function appleShape(g, R) {
  g.beginPath();
  g.moveTo(0, -R * .66);
  g.bezierCurveTo(R * .42, -R * 1.02, R * 1.04, -R * .7, R * .98, -R * .04);
  g.bezierCurveTo(R * .94, R * .58, R * .52, R * .98, R * .2, R * .95);
  g.bezierCurveTo(R * .08, R * .92, -R * .08, R * .92, -R * .2, R * .95);
  g.bezierCurveTo(-R * .52, R * .98, -R * .94, R * .58, -R * .98, -R * .04);
  g.bezierCurveTo(-R * 1.04, -R * .7, -R * .42, -R * 1.02, 0, -R * .66);
  g.closePath();
}
function melonStripes(g, R, color, seed) {
  g.save(); circlePath(g, R * .95); g.clip();
  g.strokeStyle = color; g.lineWidth = R * .13; g.lineJoin = 'round'; g.lineCap = 'round';
  for (let k = -4; k <= 4; k++) {
    const lon = k * .36;
    g.beginPath();
    for (let i = 0; i <= 40; i++) {
      const lat = -Math.PI / 2 + i / 40 * Math.PI;
      const zig = (i % 2 ? 1 : -1) * R * .035 * Math.cos(lat);
      const x = R * Math.sin(lon) * Math.cos(lat) + zig;
      const y = R * Math.sin(lat);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}

  const S = Math.max(4, Math.ceil(pxR * 2 * PAD));
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.translate(S / 2, S / 2);
  DRAW[t](g, pxR);
  return c;
}
function tintRed(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;

  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = 'rgba(255,30,60,.62)';
  g.fillRect(0, 0, c.width, c.height);
  return c;
}

/* ================= Physics ================= */
const easeOutQuad = p => 1 - (1 - p) * (1 - p);
const easeOutBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

function solveStatic(b, nx, ny, pen) {
  b.x += nx * pen; b.y += ny * pen;
  const rx = -nx * b.cr, ry = -ny * b.cr;
  const cvx = b.vx - b.w * ry, cvy = b.vy + b.w * rx;
  const vn = cvx * nx + cvy * ny;
  if (vn >= 0) return;
  const e = vn < -70 ? REST : 0;
  const jn = -(1 + e) * vn / b.im;
  const tx = -ny, ty = nx;
  const vt = cvx * tx + cvy * ty;
  let jt = -vt / (3 * b.im);
  const mx = FRICTION * jn;
  if (jt > mx) jt = mx; else if (jt < -mx) jt = -mx;
  b.vx += (jn * nx + jt * tx) * b.im;
  b.vy += (jn * ny + jt * ty) * b.im;
  b.w += -b.cr * jt * b.iI;
}

function solvePair(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, rs = a.cr + b.cr;
  const d2 = dx * dx + dy * dy;
  if (d2 >= rs * rs) return;
  let d = Math.sqrt(d2), nx, ny;
  if (d < 1e-4) { nx = 0; ny = 1; d = 0; } else { nx = dx / d; ny = dy / d; }
  const pen = rs - d, ims = a.im + b.im;
  const corr = Math.max(pen - .1, 0) * .55 / ims;
  a.x -= nx * corr * a.im; a.y -= ny * corr * a.im;
  b.x += nx * corr * b.im; b.y += ny * corr * b.im;
  const avx = a.vx - a.w * (ny * a.cr), avy = a.vy + a.w * (nx * a.cr);
  const bvx = b.vx + b.w * (ny * b.cr), bvy = b.vy - b.w * (nx * b.cr);
  const rvx = bvx - avx, rvy = bvy - avy;
  const vn = rvx * nx + rvy * ny;
  if (vn >= 0) return;
  const e = vn < -70 ? REST : 0;
  const jn = -(1 + e) * vn / ims;
  const tx = -ny, ty = nx;
  const vt = rvx * tx + rvy * ty;
  let jt = -vt / (3 * ims);
  const mx = FRICTION * jn;
  if (jt > mx) jt = mx; else if (jt < -mx) jt = -mx;
  const px = jn * nx + jt * tx, py = jn * ny + jt * ty;
  a.vx -= px * a.im; a.vy -= py * a.im;
  b.vx += px * b.im; b.vy += py * b.im;
  a.w += -a.cr * jt * a.iI;
  b.w += -b.cr * jt * b.iI;
}

function step(dt) {
  const B = S.bodies;
  for (const b of B) {
    b.age += dt;
    if (b.pop < 1) b.pop = Math.min(1, b.pop + dt / .2);
    b.cr = b.r * (b.pop < 1 ? .6 + .4 * easeOutQuad(b.pop) : 1);
    b.vy += G * dt;
    b.vx *= .9995; b.vy *= .9995; b.w *= .985;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 2200) { b.vx *= 2200 / sp; b.vy *= 2200 / sp; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.w * dt;

function floatText(txt, x, y, col, size) {

}

/* ================= Audio ================= */
let actx = null, master = null, noiseBuf = null;
function ensureAudio() {

      master = actx.createGain(); master.gain.value = .7; master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate * .5, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch { actx = null; }

}
function tone(f1, f2, dur, type = 'sine', vol = .2, delay = 0) {

  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .03);
}

  const g = actx.createGain();

  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + .02);
}
const sfx = {
  drop() { tone(640, 300, .09, 'sine', .16); },
  merge(t) {

    tone(f * 1.5, f * 1.9, .12, 'sine', .08, .05);

  shake() { tone(150, 80, .3, 'sine', .28); tone(300, 700, .16, 'triangle', .07, .04); hiss(.3, .06, 600); },
  tick() { tone(980, 900, .06, 'sine', .07); },
  over() { [523, 440, 349, 262].forEach((f, i) => tone(f, f * .97, .24, 'triangle', .16, i * .15)); },

/* ================= Input ================= */
function toWorldX(clientX) {

}
function setAim(x) {

}
let dragging = false;
canvas.addEventListener('pointerdown', e => {

/* ================= Rendering ================= */
function resize() {
  const rect = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = Math.max(1, rect.width), ch = Math.max(1, rect.height);
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  const scale = Math.min(cw / VIEW.w, ch / VIEW.h);
  view = {
    scale, dpr, cw, ch,
    ox: (cw - VIEW.w * scale) / 2 - VIEW.x0 * scale,
    oy: (ch - VIEW.h * scale) / 2 - VIEW.y0 * scale,
  };
  sprites = FRUITS.map((f, i) => makeSprite(i, f.r * scale * dpr));
  redSprites = sprites.map(tintRed);
}

function roundedJar(path) {
  const r = 26, l = -5, rt = W + 5, b = FLOOR + 5;
  path.moveTo(l, DANGER_Y);
  path.lineTo(l, b - r);
  path.quadraticCurveTo(l, b, l + r, b);
  path.lineTo(rt - r, b);
  path.quadraticCurveTo(rt, b, rt, b - r);
  path.lineTo(rt, DANGER_Y);
}

function drawSprite(b, x, y, scaleMul, red) {
  const img = sprites[b.t];
  const hw = b.r * PAD * scaleMul;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(b.a);
  ctx.drawImage(img, -hw, -hw, hw * 2, hw * 2);
  if (red > 0) { ctx.globalAlpha = red; ctx.drawImage(redSprites[b.t], -hw, -hw, hw * 2, hw * 2); }
  ctx.restore();
}

function render() {
  const { scale, dpr, ox, oy } = view;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let qx = 0, qy = 0;
  if (S.quake > 0) {
    const q = S.quake / .45;
    qx = Math.sin(S.time * 70) * 7 * q; qy = Math.cos(S.time * 55) * 4 * q;
  }
  const k = scale * dpr;
  ctx.setTransform(k, 0, 0, k, (ox + qx * scale) * dpr, (oy + qy * scale) * dpr);

  const danger = S.dangerT > 0;
  const blink = danger ? .5 - .5 * Math.cos(S.dangerT * TAU * .95) : 0;

  ctx.beginPath(); ctx.ellipse(W / 2, FLOOR + 10, W * .55, 9, 0, 0, TAU); ctx.fill();

  const gr = ctx.createLinearGradient(0, DANGER_Y, 0, FLOOR);

  ctx.fillStyle = gr; ctx.fill(jar);
  if (danger) { ctx.fillStyle = `rgba(255,79,109,${.08 * blink})`; ctx.fill(jar); }

  // aim guide

    const r = FRUITS[S.cur].r;
    let hit = FLOOR;
    for (const b of S.bodies) {
      const dx = Math.abs(b.x - S.aim);
      if (dx < b.r) hit = Math.min(hit, b.y - Math.sqrt(b.r * b.r - dx * dx));
    }
    ctx.fillStyle = S.canDrop ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.4)';
    for (let y = DROP_Y + r + 10; y < hit - 4; y += 15) {
      ctx.beginPath(); ctx.arc(S.aim, y, 2.4, 0, TAU); ctx.fill();
    }
  }

  // fruit

  }

  // held fruit

    const s = S.holdPop < 1 ? easeOutBack(S.holdPop) : 1;
    const bob = Math.sin(S.time * 3) * 1.5;
    drawSprite({ t: S.cur, r: FRUITS[S.cur].r, a: Math.sin(S.time * 2) * .06 }, S.aim, DROP_Y + bob, Math.max(.01, s), 0);
  }

    } else if (p.k === 'drop') {

  ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = 9; ctx.stroke(wall);
  ctx.beginPath();
  ctx.moveTo(-5, DANGER_Y); ctx.lineTo(W + 5, DANGER_Y); ctx.lineTo(W - 16, DANGER_Y - 24); ctx.lineTo(16, DANGER_Y - 24); ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,.26)'; ctx.fill();

  ctx.setLineDash([12, 10]);

  ctx.restore();

  // hint

    ctx.globalAlpha = S.hint;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '600 21px Fredoka, "Trebuchet MS", sans-serif';
    ctx.fillStyle = 'rgba(46,109,100,.85)';
    ctx.fillText('Drag to aim, let go to drop', W / 2, DANGER_Y + 190);
    ctx.font = '500 15px Fredoka, "Trebuchet MS", sans-serif';
    ctx.fillStyle = 'rgba(46,109,100,.6)';
    ctx.fillText('Match two of a kind to grow them', W / 2, DANGER_Y + 218);

  }

    ctx.fillStyle = t.col; ctx.fillText(t.txt, 0, 0);
    ctx.restore();
  }

}

/* ================= Loop ================= */
function update(dt) {
  S.time += dt;
  if (S.quake > 0) S.quake = Math.max(0, S.quake - dt);
  for (const p of S.parts) {
    p.life += dt;
    if (p.k === 'puff') { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .9; p.vy *= .9; }
    else if (p.k === 'drop' || p.k === 'star') { p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  }
  S.parts = S.parts.filter(p => p.life < p.max);
  for (const t of S.texts) t.life += dt;
  S.texts = S.texts.filter(t => t.life < t.max);

  if (S.shown !== S.score) {
    S.shown += Math.max(1, Math.ceil((S.score - S.shown) * .2));
    if (S.shown > S.score) S.shown = S.score;
    scoreEl.textContent = S.shown.toLocaleString();
  }
  bestEl.textContent = best.toLocaleString();

  if (S.over || paused) return;

  if (S.dropped > 0 && S.hint > 0) S.hint = Math.max(0, S.hint - dt * 2);
  if (!S.canDrop) {
    S.dropTimer -= dt;
    if (S.dropTimer <= 0) { S.canDrop = true; S.holdPop = 0; setAim(S.aim); }
  } else if (S.holdPop < 1) S.holdPop = Math.min(1, S.holdPop + dt / .25);
  if (S.shakeCd > 0) S.shakeCd = Math.max(0, S.shakeCd - dt);
  updateShakeBtn();

  acc += dt;
  while (acc >= DT) { step(DT); acc -= DT; }

  // danger check
  let any = false;
  for (const b of S.bodies) {
    b.danger = b.age > GRACE && b.y - b.r < DANGER_Y;
    if (b.danger) any = true;
  }
  if (any) {
    const before = S.dangerT;
    S.dangerT += dt;
    const p0 = Math.floor(before * .95 + .5), p1 = Math.floor(S.dangerT * .95 + .5);
    if (p1 > p0) sfx.tick();
    if (S.dangerT >= DANGER_LIMIT) gameOver();
  } else {
    S.dangerT = 0;
  }
}

let acc = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ================= Boot ================= */
function start(data) {
  S = fresh();
  if (data && Array.isArray(data.bodies)) {
    try {
      for (const d of data.bodies) {
        const b = newBody(d.t, d.x, d.y);
        Object.assign(b, { vx: d.vx || 0, vy: d.vy || 0, a: d.a || 0, w: d.w || 0, age: 5 });
        S.bodies.push(b);
      }
      S.score = S.shown = data.score || 0;
      S.cur = data.cur ?? S.cur; S.next = data.next ?? S.next;
      S.maxT = data.maxT ?? S.maxT; S.dropped = data.dropped || 0;
      if (S.dropped) S.hint = 0;
      scoreEl.textContent = S.score.toLocaleString();
    } catch { S = fresh(); }
  }
  renderSoundBtn();
  updateNext(); updateEvo(); updateShakeBtn();
  resize();
  new ResizeObserver(resize).observe(stage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
  requestAnimationFrame(t => { last = t; frame(t); });
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') {
  try {
    hot.snapshot(() => S && !S.over ? {
      bodies: S.bodies.map(b => ({ t: b.t, x: b.x, y: b.y, vx: b.vx, vy: b.vy, a: b.a, w: b.w })),
      score: S.score, cur: S.cur, next: S.next, maxT: S.maxT, dropped: S.dropped,
    } : {});
  } catch {}
}
hot && hot.ready ? hot.ready(start) : start((hot && hot.data) || {});
})();
</script>
